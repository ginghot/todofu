<div id="app">

  <!-- スタート画面 -->
  <section id="screen-start" class="screen">
    <h1 class="title">都道府県クイズ</h1>
    <p class="subtitle">モードを選んでスタート！</p>
    <p class="region-label">地方を選ぶ（省略時は全国）</p>
    <div id="region-list" class="region-list"></div>
    <div class="mode-list">
      <button class="mode-btn" data-mode="pref">
        <span class="mode-btn-title">都道府県モード</span>
        <span class="mode-btn-desc">白地図の色つき県名を当てよう</span>
      </button>
      <button class="mode-btn" data-mode="capital">
        <span class="mode-btn-title">県庁所在地モード</span>
        <span class="mode-btn-desc">県名から県庁所在地を当てよう</span>
      </button>
      <button class="mode-btn" data-mode="both">
        <span class="mode-btn-title">両方モード</span>
        <span class="mode-btn-desc">県名と県庁所在地の両方を当てよう</span>
      </button>
      <button class="mode-btn" data-mode="browse">
        <span class="mode-btn-title">閲覧モード</span>
        <span class="mode-btn-desc">地図に都道府県名を表示して確認しよう</span>
      </button>
    </div>
    <p class="credit">地図データ: <a href="https://github.com/geolonia/japanese-prefectures" target="_blank" rel="noopener">Geolonia japanese-prefectures</a>（GFDL, based on Wikipedia）</p>
  </section>

      </label>
      <label id="capital-toggle-label" class="names-toggle-label">
        <input type="checkbox" id="capital-toggle">
        県庁所在地を表示
      </label>
    </div>
